name: Test setup-alya

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.label }}, ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        version: ['latest', '0.0.19']
        include:
          - os: ubuntu-latest
            label: Linux x64
          - os: windows-latest
            label: Windows x64
          - os: macos-latest
            label: macOS ARM64
          - os: macos-15-intel
            label: macOS Intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Alya Compiler (${{ matrix.version }})
        id: alya
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Verify alya executable on PATH
        run: |
          alya --version

      - name: Check action outputs
        shell: bash
        run: |
          echo "Output version: ${{ steps.alya.outputs.version }}"
          echo "Output path:    ${{ steps.alya.outputs.alya-path }}"
          test -n "${{ steps.alya.outputs.version }}"
          test -n "${{ steps.alya.outputs.alya-path }}"

      - name: Test simple Alya execution
        shell: bash
        run: |
          echo 'say "Hello from setup-alya CI!"' > hello.alya
          alya run hello.alya

  test-arm:
    name: Test (${{ matrix.label }}, ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
        version: ['latest', '0.0.19']
        include:
          - os: ubuntu-24.04-arm
            label: Linux ARM64
          - os: windows-11-arm
            label: Windows ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Alya Compiler (${{ matrix.version }})
        id: alya
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Verify alya executable on PATH
        run: |
          alya --version

      - name: Test simple Alya execution
        shell: bash
        run: |
          echo 'say "Hello from setup-alya ARM CI!"' > hello.alya
          alya run hello.alya

  test-x86:
    name: Test (Linux x86, ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['latest', '0.0.19']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test x86 installer in 32-bit userland
        env:
          INPUT_VERSION: ${{ matrix.version }}
          INPUT_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/ws" \
            -w /ws \
            -e INPUT_VERSION="${INPUT_VERSION}" \
            -e INPUT_CHECK_CHECKSUM=true \
            -e INPUT_TOKEN="${INPUT_TOKEN}" \
            -e INPUT_TOOLCHAIN=true \
            i386/debian:trixie-slim sh -c '
              set -e
              apt-get update && apt-get install -y python3 gcc libc6-dev ca-certificates
              python3 ./setup_alya.py
              ALYA=$(find /root/.alya -name alya -type f | head -n 1)
              test -n "$ALYA"
              "$ALYA" --version
              echo "say \"Hello from setup-alya x86 CI!\"" > hello_x86.alya
              "$ALYA" run hello_x86.alya
            '

  test-arch-override:
    name: Test (arch override to x86, ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['latest', '0.0.19']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-i386

      - name: Set up 32-bit Alya Compiler via arch override
        id: alya
        uses: ./
        with:
          version: ${{ matrix.version }}
          arch: x86

      - name: Verify 32-bit alya executable
        shell: bash
        run: |
          alya --version
          file "$(which alya)" | grep -i "32-bit"
          echo 'say "Hello from setup-alya arch override!"' > hello_override.alya
          alya run hello_override.alya
